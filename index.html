<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japonya Seyahat Asistanı</title>
<meta name="description" content="19 Aralık 2026 – 2 Ocak 2027 Japonya seyahat planı: şimdi ne yapmalıyım, harita, işaretleme, yemek ve listeler.">
<meta name="theme-color" content="#f6f3ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japonya">
<style>
:root{
  --bg:#f6f3ed; --surface:#fffdf9; --surface2:#efe9df; --ink:#1f1d1a; --ink2:#57524a; --ink3:#8a8378;
  --line:#e3dccf; --accent:#c0412a; --accent-soft:#f6e1da; --ok:#2e8454; --ok-soft:#dcefe3;
  --warn:#9a6412; --warn-soft:#fbefd2; --bad:#b3342a; --bad-soft:#f7dcd8; --info:#2f5f9e; --info-soft:#dde7f4;
  --osaka:#3c8a56; --kyoto:#7657a6; --tokyo:#346bb3; --bus:#d27a22;
  --shadow:0 1px 2px rgba(40,30,20,.05),0 6px 18px rgba(40,30,20,.06);
  --r:16px; --tap:48px; --nav:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121419; --surface:#1b1e25; --surface2:#252a34; --ink:#ece6dc; --ink2:#b8b1a6; --ink3:#878177;
    --line:#2f3441; --accent:#e46a50; --accent-soft:#3b2520; --ok:#52b77f; --ok-soft:#1d3327;
    --warn:#e3ad52; --warn-soft:#3a2f18; --bad:#ec7a6c; --bad-soft:#3d2220; --info:#7aa7e6; --info-soft:#1e2a3d;
    --osaka:#5db67b; --kyoto:#a488d4; --tokyo:#6d9fe4; --bus:#ee9d4c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1b1e25; --surface2:#252a34; --ink:#ece6dc; --ink2:#b8b1a6; --ink3:#878177;
  --line:#2f3441; --accent:#e46a50; --accent-soft:#3b2520; --ok:#52b77f; --ok-soft:#1d3327;
  --warn:#e3ad52; --warn-soft:#3a2f18; --bad:#ec7a6c; --bad-soft:#3d2220; --info:#7aa7e6; --info-soft:#1e2a3d;
  --osaka:#5db67b; --kyoto:#a488d4; --tokyo:#6d9fe4; --bus:#ee9d4c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
html[data-font="1"]{font-size:112.5%} html[data-font="2"]{font-size:125%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.25}
.serif{font-family:"Iowan Old Style","Hiragino Mincho ProN","Yu Mincho","Noto Serif",Georgia,serif}
.muted{color:var(--ink3)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.hide{display:none!important}

/* üst çubuk */
#top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
#top .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#top .sun{width:26px;height:26px;border-radius:50%;background:var(--accent);flex:none;box-shadow:inset 0 0 0 3px var(--bg),0 0 0 1.5px var(--accent)}
#top .clock{display:flex;flex-direction:column;min-width:0}
#top .clock b{font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
#top .clock span{font-size:.75rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.sos{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad);font-weight:800;font-size:.8rem;letter-spacing:.04em;width:auto;padding:0 12px}
.simbadge{font-size:.65rem;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:middle}

main#view{padding:12px 16px calc(var(--nav) + env(safe-area-inset-bottom) + 24px);max-width:680px;margin:0 auto;min-height:60vh}
body.map-mode main#view{display:none}
#mapWrap{display:none;position:fixed;left:0;right:0;top:var(--toph,60px);bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:5}
body.map-mode #mapWrap{display:block}
#map{position:absolute;inset:0;background:var(--surface2)}

/* alt sekmeler */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.04)}
#tabs button{height:var(--nav);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:.7rem;font-weight:600;position:relative}
#tabs button svg{width:24px;height:24px}
#tabs button[aria-current="page"]{color:var(--accent)}
#tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* kartlar */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2{font-size:1.05rem}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.eyebrow .nc{text-transform:none;letter-spacing:.02em}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.hero{border-width:1.5px;border-color:color-mix(in srgb,var(--c,var(--accent)) 45%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--accent)) 7%,var(--surface)),var(--surface) 70%)}
.hero .eyebrow{color:var(--c,var(--accent))}
.hero h1{font-size:1.45rem;margin:2px 0 6px}
.bigtime{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:8px;transition:width .4s}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack>*+*{margin-top:8px}
.transit{background:var(--info-soft);border-radius:12px;padding:10px 12px;margin:10px 0 4px;display:flex;gap:10px;align-items:flex-start}
.transit svg{flex:none;width:22px;height:22px;color:var(--info);margin-top:1px}
.transit b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--info)}
.note{color:var(--ink2);font-size:.92rem;margin:6px 0 0;white-space:pre-line}
.mynote{background:var(--warn-soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.92rem;white-space:pre-line}
.daybanner{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.daybanner .num{width:52px;height:52px;border-radius:14px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.daybanner .num b{font-size:1.35rem} .daybanner .num span{font-size:.62rem;font-weight:700;text-transform:uppercase;opacity:.9;margin-top:2px}
.daybanner h2{font-size:1.2rem}
.city-osaka{--c:var(--osaka)} .city-kyoto{--c:var(--kyoto)} .city-tokyo{--c:var(--tokyo)} .city-bus{--c:var(--bus)}

/* butonlar */
.btn{min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650;text-decoration:none;color:var(--ink);font-size:.95rem}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.okline{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.btn.info{background:var(--info);border-color:var(--info);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:40px;padding:0 11px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.skip[aria-pressed="true"]{background:var(--surface2);border-color:var(--ink3);color:var(--ink2)}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-top:12px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.rz{background:var(--warn-soft);color:var(--warn)}
.chip.kardes{background:var(--ok-soft);color:var(--ok)}
.chip.benim{background:var(--info-soft);color:var(--info)}
.chip.ops{background:var(--surface2);color:var(--ink2)}
.chip.alt{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.city{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* gün şeridi */
.daystrip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.daystrip button{flex:none;scroll-snap-align:center;width:54px;min-height:64px;padding-bottom:6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.daystrip button b{font-size:1.1rem;line-height:1}
.daystrip button span{font-size:.66rem;color:var(--ink3);font-weight:700;text-transform:uppercase}
.daystrip button::after{content:"";position:absolute;bottom:3px;width:18px;height:3px;border-radius:2px;background:var(--c)}
.daystrip button[aria-current="true"]{background:var(--c);border-color:var(--c);color:#fff}
.daystrip button[aria-current="true"] span{color:#fff;opacity:.9}
.daystrip button[aria-current="true"]::after{background:#fff}
.daystrip button.today{box-shadow:inset 0 0 0 2px var(--accent)}

/* aktivite listesi */
.acts{position:relative;margin-top:4px}
.act{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);position:relative}
.act:last-child{border-bottom:0}
.act .t{font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
.act .t b{display:block;font-size:1rem}
.act .t span{font-size:.78rem;color:var(--ink3)}
.act h3{font-size:1.02rem;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.act h3 .st{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:-1px}
.act.done h3 .st{background:var(--ok);border-color:var(--ok);color:#fff}
.act.skip h3 .st{background:var(--surface2);border-color:var(--ink3);color:var(--ink3)}
.act.done h3 .ttl{color:var(--ink2)}
.act.skip h3 .ttl{text-decoration:line-through;color:var(--ink3)}
.act.now{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 8%,transparent),transparent);border-radius:12px;margin:0 -8px;padding:12px 8px}
.act.now .t b{color:var(--accent)}
.act.alt{opacity:.85}
.act.alt .t b{color:var(--accent)}
.act .ab{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.act .ab .btn{min-height:40px;padding:0 10px;font-size:.85rem}
.act .open{all:unset;cursor:pointer;display:block}
.act .note{font-size:.88rem}
.nearbadge{color:var(--info);font-size:.78rem;font-weight:700}
.alts{margin-top:14px}

/* liste öğeleri */
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h3{font-size:1rem}
.item .meta{font-size:.8rem;color:var(--ink3);margin-top:2px}
.check{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}
.check input{appearance:none;-webkit-appearance:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);margin:2px 0 0 4px;display:grid;place-items:center;background:var(--surface)}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check.on h3{color:var(--ink3);text-decoration:line-through}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:650;font-size:.88rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec-title{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:18px 2px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem;margin-top:8px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:88px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:var(--shadow)}
.tile svg{width:26px;height:26px;color:var(--accent)}
.tile b{font-size:.98rem}
.tile span{font-size:.75rem;color:var(--ink3)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);font-weight:700;min-height:44px;padding:0;margin-bottom:4px}
.back svg{width:20px;height:20px}
.pagetitle{font-size:1.4rem;margin:2px 0 12px}
label.f{display:block;font-size:.82rem;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.inp{width:100%;min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;font-size:1rem}
textarea.inp{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big-countdown{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem}
.stat span{font-size:.72rem;color:var(--ink3)}
.wx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.wx div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.wx .ic{font-size:1.6rem}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.92rem}
.okbox{background:var(--ok-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.92rem}
.infobox{background:var(--info-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.9rem}
.linklist a{display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-weight:650}
.dist{font-variant-numeric:tabular-nums;font-weight:700;color:var(--info);white-space:nowrap}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--warn-soft)}100%{background:transparent}}

/* alt sayfa (sheet) */
#scrim{position:fixed;inset:0;background:rgba(10,10,15,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .22s ease;max-width:680px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
#sheet.on{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
#sheet .close{position:absolute;right:10px;top:10px}
/* tam ekran katman */
#full{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:none;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
#full.on{display:block}
#full.dark{background:#000;color:#fff}
.taxi-big{font-size:2.1rem;font-weight:800;line-height:1.25;margin:10px 0}
.taxi-jp{font-size:2.6rem;font-weight:800;line-height:1.3;margin:6px 0 14px;word-break:break-word}
.phr{padding:14px 0;border-bottom:1px solid var(--line)}
.phr .jp{font-size:1.6rem;font-weight:800}
.phr .ro{color:var(--ink2);font-style:italic}
.docimg{width:100%;height:auto;border-radius:12px;background:#fff;display:block}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface2);flex:none}

#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);z-index:90;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#prox,#upd{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);z-index:70;max-width:656px;margin:0 auto}
#upd{bottom:auto;top:calc(env(safe-area-inset-top) + 70px)}
#prox .card,#upd .card{box-shadow:0 10px 30px rgba(0,0,0,.2);border-color:var(--info);margin:0}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
#lock .inp{max-width:220px;text-align:center;font-size:1.6rem;letter-spacing:.4em}

/* harita */
.mapbar{position:absolute;top:8px;left:0;right:0;z-index:500;display:flex;gap:6px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.mapbar::-webkit-scrollbar{display:none}
.mapbar button{flex:none;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow);color:var(--ink)}
.mapbar button[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff;border-color:var(--c,var(--ink))}
.mapfab{position:absolute;right:12px;bottom:16px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapfab button{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.mapfab svg{width:24px;height:24px}

":"19 Aralık","route":"KIX → Osaka (Umeda)","how":"JR Kansai Airport Rapid","detail":"Aktarmasız ~65–70 dk, ~1.200¥, IC kart geçer. Osaka İst.’dan otele ~10–12 dk yürüyüş. Alternatif: Nankai → Namba + Midosuji → Umeda.","source":"https://www.westjr.co.jp/global/en/","url":"https://www.westjr.co.jp/global/en/"},{"row":18,"when":"20–22 Aralık","route":"Osaka şehir içi","how":"Osaka Metro (Midosuji, Chuo, Sakaisuji) + yürüyüş","detail":"Tek biniş ~190–290¥. Günde 4+ biniş yapacaksan Osaka Metro 1 günlük bileti (Enjoy Eco Card) hesapla. IC kart her yerde geçer.","source":"https://subway.osakametro.co.jp/en/","url":"https://subway.osakametro.co.jp/en/"},{"row":19,"when":"22 Aralık","route":"Osaka ⇄ Nara (günübirlik)","how":"Kintetsu Nara Hattı","detail":"Umeda → Namba Midosuji ~8 dk, sonra Osaka-Namba → Kintetsu-Nara ~40 dk, ~680¥; aynı yoldan dönüş. Alternatif JR Osaka → JR Nara ~50 dk. Valiz Osaka otelinde kalıyor.","source":"https://www.kintetsu.co.jp/foreign/english/about/station/route_map/","url":"https://www.kintetsu.co.jp/foreign/english/about/station/route_map/"},{"row":20,"when":"22 Aralık","route":"Namba → Osakako (Kaiyukan)","how":"Midosuji + Chuo Hattı","detail":"Hommachi aktarmalı ~25 dk, ~290¥. Akşam Tsuruhashi için Namba’dan Sennichimae Hattı ~7 dk.","source":"https://subway.osakametro.co.jp/en/","url":"https://subway.osakametro.co.jp/en/"},{"row":21,"when":"23 Aralık","route":"Osaka → Kyoto","how":"Hankyu (Osaka-umeda → Kyoto-kawaramachi)","detail":"Limited Express aktarmasız ~44 dk, ~410¥. Otelden istasyona ~10 dk, Kawaramachi’den Millennials’a ~5–8 dk. Valizle en kolay rota.","source":"https://www.hankyu.co.jp/global/en/","url":"https://www.hankyu.co.jp/global/en/"},{"row":22,"when":"23–25 Aralık","route":"Kyoto şehir içi","how":"Keihan, Hankyu, metro, şehir otobüsü, taksi","detail":"Şehir otobüsü sabit ~230¥ (arka kapıdan bin, önden in). Kalabalık otobüs yerine tren + yürüyüşü tercih et; 2–3 kişi için kısa mesafede taksi mantıklı.","source":"https://www2.city.kyoto.lg.jp/kotsu/webguide/en/","url":"https://www2.city.kyoto.lg.jp/kotsu/webguide/en/"},{"row":23,"when":"25 Aralık","route":"Kyoto → Tokyo valiz","how":"Valiz otobüste veya takkyubin (Yamato)","detail":"Gece otobüsünde genelde 1 büyük valiz bagaja alınır. 9h Akasaka büyük valiz kabul etmiyorsa takkyubin ile 29 Aralık teslim olacak şekilde Toda’daki Toyoko Inn’e gönder (~2.000–3.000¥, otele önceden haber ver).","source":"https://www.global-yamato.com/en/hands-free-travel/","url":"https://www.global-yamato.com/en/hands-free-travel/"},{"row":24,"when":"25→26 Aralık","route":"Kyoto → Tokyo (GECE)","how":"GECE OTOBÜSÜ: Willer Express / JR Bus “Dream” / Kosokubus","detail":"Kyoto İst. Hachijo (güney) çıkışı ~21:30–23:00 kalkış → Busta Shinjuku ~06:00–07:30 varış, ~7–8 sa. Yılbaşı öncesi fiyatlar yüksek (tahmini 5.000–15.000¥). Uyumak için yan koltuğu boş/perdeli “relax” koltuk tipini seç. Genelde 1 büyük valiz bagaja + 1 küçük çanta; koşulu bilette oku. Otel gecesi ödenmez.","source":"https://willerexpress.com/en/","url":"https://willerexpress.com/en/"},{"row":25,"when":"25→26 Aralık","route":"Gece otobüsü alternatifi","how":"Kosokubus.com (karşılaştırma)","detail":"Farklı firmaların seferlerini tek ekranda karşılaştırır. JR Bus Dream seferleri Tokyo/Shinjuku’ya gider.","source":"https://www.kosokubus.com/en/","url":"https://www.kosokubus.com/en/"},{"row":26,"when":"26–29 Aralık","route":"Tokyo şehir içi (Akasaka üssü)","how":"Tokyo Metro Ginza + Marunouchi hatları","detail":"Busta Shinjuku → Akasaka-mitsuke Marunouchi ~15 dk. Ginza Hattı Shibuya, Omotesando, Ginza, Ueno, Asakusa’ya aktarmasız. Tek biniş ~180–260¥; Tokyo Subway Ticket (24/48/72 saat) hesaplı olabilir.","source":"https://www.tokyometro.jp/en/","url":"https://www.tokyometro.jp/en/"},{"row":27,"when":"29 Aralık","route":"Akasaka → Kita-Toda (otel değişimi)","how":"Marunouchi Hattı + JR Saikyo Hattı","detail":"Sabah valizi 9h’de bırak, akşam Ginza’dan dönerken al; Akasaka-mitsuke → Shinjuku (Marunouchi) → JR Saikyo Hattı → Kita-Toda. Süreyi ve aktarmayı Google Maps’te teyit et. 29 Aralık–2 Ocak her gün merkeze Saikyo Hattı ile gidiş-dönüş.","source":"https://www.tokyometro.jp/en/","url":"https://www.tokyometro.jp/en/"},{"row":28,"when":"30 Aralık","route":"Shinjuku → Kawaguchiko","how":"FUJI EXCURSION","detail":"Gidiş ve dönüş koltuğunu al. Hava tahminine göre bilet koşulları izin verirse gün değiştir. Alternatif: Busta Shinjuku’dan otobüs (~2 sa).","source":"https://www.jreast.co.jp/en/multi/traininformation/azusa_kaiji/","url":"https://www.jreast.co.jp/en/multi/traininformation/azusa_kaiji/"},{"row":29,"when":"31 Aralık","route":"Shinjuku ⇄ Kamakura / Enoshima","how":"JR Shonan-Shinjuku + Enoden + Odakyu","detail":"Gidiş JR ~60–90 dk (~950¥); Kamakura–Hase–Enoshima arası Enoden (~200–300¥); dönüş Katase-Enoshima → Shinjuku Odakyu ~70 dk (~660¥).","source":"https://www.enoden.co.jp/en/","url":"https://www.enoden.co.jp/en/"},{"row":30,"when":"2 Ocak","route":"Shinjuku → Narita","how":"Narita Express","detail":"Valizle Toda’dan Shinjuku’ya gelip N’EX’e bin. Yaklaşık 80–100 dk tren payı, ayrıca otel ve terminal yürüyüşü. Hedef havalimanı varışı 18.30. Tren saati ve terminali rezervasyonda doğrula.","source":"https://www.jreast.co.jp/en/multi/nex/","url":"https://www.jreast.co.jp/en/multi/nex/"},{"row":31,"when":"Tüm seyahat","route":"IC kart","how":"ICOCA / Suica (telefonda)","detail":"Tüm şehir içi ulaşım, konbini ve dolaplarda geçer. Bu planda Shinkansen yok, JR Pass GEREKMİYOR.","source":"https://www.jreast.co.jp/multi/en/pass/suica.html","url":"https://www.jreast.co.jp/multi/en/pass/suica.html"},{"row":32,"when":"Yılbaşı","route":"29 Aralık–3 Ocak","how":"İşletme saatleri","detail":"Çok sayıda işletmede kapanış veya kısaltılmış saat olabilir. 31 Aralık ve 1 Ocak yemeklerini önceden planla; 2026–2027 özel etkinlik takvimleri henüz teyit edilmedi.","source":"https://www.japan.travel/en/plan/business-hours-and-holidays/","url":"https://www.japan.travel/en/plan function situation(t){
  const all = PLAN.flatMap(liveActs);
  const tripStart = Math.min(...all.map(aStart)), tripEnd = Math.max(...all.map(aEnd));

  if (t >= tripEnd) return {mode:'post', tripStart, tripEnd, t};
  let ds = tripDateOf(t);
  if (ds < PLAN[0].date) ds = PLAN[0].date;
  if (ds > PLAN[PLAN.length - 1].date) ds = PLAN[PLAN.length - 1].date;
  const di = DAYIDX[ds], day = PLAN[di], acts = liveActs(day);
  const nm = (t - dayStart(ds)) / MIN;
  const curs = acts.filter(a => a.sm <= nm && nm < a.em);
  const cur = curs.length ? curs[curs.length - 1] : null;
  let next = acts.find(a => a.sm > nm && a !== cur) || null, nextDay = null;
  if (!next && PLAN[di + 1]) { nextDay = PLAN[di + 1]; next = liveActs(nextDay)[0] || null; }
  const prevDay = PLAN[di - 1] || null;
  let state = 'act';
  if (!cur) {
    if (!acts.length || nm < acts[0].sm) state = 'before';
    else if (nm >= acts[acts.length - 1].em) state = 'after';

  return {mode:'trip', t, ds, di, day, acts, nm, cur, next, nextDay, prevDay, state, tripStart, tripEnd};
}
function schedule(s){
  const acts = s.acts; const marked = acts.map(a => stOf(a.id));

  const doneN = marked.filter(Boolean).length;

  if (lastIdx < 0) { out.kind = 'none'; return out; }
  const p = acts.findIndex((a, i) => i > lastIdx && !marked[i]);
  if (p < 0) { out.kind = 'complete'; return out; }
  const pa = acts[p]; out.pending = pa;

const linkBtn = (url, label, cls = 'btn sm') => safeUrl(url) ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${IC.ext}${esc(label)}</a>` : '';

/* ------------------------------------------------------------ yönlendirme */
let ROUTE = {tab:'simdi', a:null, b:null};
function parseHash(){ const p = (location.hash || '').replace(/^#\/?/, '').split('/').map(decodeURIComponent); return {tab:p[0] || 'simdi', a:p[1] || null, b:p[2] || null}; }
function go(tab, a, b){ const h = '#/' + [tab, a, b].filter(Boolean).map(encodeURIComponent).join('/'); if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => { ROUTE = parseHash(); closeSheet(); render(true); });

/* ------------------------------------------------------------ çizim */
function render(scrollTop){
  ROUTE = parseHash();
  const tab = ROUTE.tab;
  $$('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.go === tab ? 'page' : 'false'));
  document.body.classList.toggle('map-mode', tab === 'harita');
  updateClock();
  const V = {simdi:vNow, plan:vPlan, harita:vMap, yemek:vFood, liste:vList, diger:vMore}[tab] || vNow;
  const html = V();
  if (html != null) $('#view').innerHTML = html;
  if (scrollTop) window.scrollTo(0, 0);
  afterRender();
}
function refreshSoft(){
  // periyodik yenileme: yazı yazılırken ya da alt sayfa açıkken dokunma
  const ae = document.activeElement;
  if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && !$('#sheet').contains(ae) && $('#view').contains(ae)) { updateClock(); return; }
  if (ROUTE.tab === 'harita') { drawMap(); updateClock(); return; }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function afterRender(){
  if ($('#wxslot')) fillWeather();
  if (ROUTE.tab === 'plan') { const b = $('.daystrip [aria-current="true"]'); if (b) b.scrollIntoView({inline:'center', block:'nearest'}); }
  if (ROUTE.tab === 'harita') ensureMap();
  if (FLASH) { const el = document.getElementById(FLASH); if (el) { el.scrollIntoView({block:'center'}); el.classList.add('flash'); } FLASH = null; }
}
let FLASH = null;
function updateClock(){
  const t = now(), p = jp(t);
  $('#clk').innerHTML = `${pad(p.h)}:${pad(p.mi)} <span class="muted small" style="font-weight:600">JST</span>${simActive ? '<span class="simbadge">SİMÜLASYON</span>' : ''}`;
  const s = situation(t);
  let sub = `${p.d} ${MON[p.mo - 1]} ${WD[p.wd]}`;
  if (s.mode === 'trip') sub += ` · Gün ${s.di + 1}/${PLAN.length} · ${CITY_TR[s.day.city]}`;
  else if (s.mode === 'pre') sub += ' · Yolculuk öncesi';
  else sub += ' · Seyahat tamamlandı';
  $('#clksub').textContent = sub;
}

/* ============================================================ ŞİMDİ */
function vNow(){
  const s = situation(now());
  let h = '';
  h += backupNag();
  if (s.mode === 'pre') return h + vPre(s);
  if (s.mode === 'post') return h + vPost(s);
  const d = s.day, city = cityOf(d);
  h += `<div class="daybanner city-${city}"><div class="num"><b>${dsParts(d.date).d}</b><span>${MON[dsParts(d.date).mo - 1]}</span></div>
    <div style="min-width:0"><div class="eyebrow" style="margin:0;color:var(--c)"><span class="dot"></span>${esc(CITY_TR[city])} · ${s.di + 1}. gün</div>
    <h2 class="serif">${esc(d.title)}</h2>${d.highlights ? `<div class="muted small">${esc(d.highlights)}</div>` : ''}</div></div>`;
  h += lastTrainAlert(s);
  h += heroCard(s);
  h += nextCard(s);
  h += scheduleCard(s);
  h += locationCard(s);
  h += tonightCard(s);
  h += foodSuggestCard(s);
  h += reservationsCard(s);
  h += warningsCard(s);
  h += '<div id="wxslot"></div>';
  h += `<button class="btn block" data-a="safe" style="margin-bottom:12px;min-height:56px">${IC.share}Güvendeyim — konumumu ve planımı paylaş</button>`;
  h += daySummaryCard(s);
  return h;
}
function actButtons(a, opts = {}){

}
function heroCard(s){

      ${a.tz ? `<div class="infobox">${esc(a.tz)}</div>` : ''}

      <h1 class="serif">🚌 Varış ~${esc(nt.arrive)}</h1><p class="note">${esc(nt.arrivePlace || '')}${n ? ` · ${fmtDur(n.sm - s.nm)} sonra` : ''}</p>
      <div class="muted small" style="margin-top:8px">Dinlen; varışta ilk iş: ${esc(n ? n.plan : '')}</div></section>`;

      <h1 class="serif">🚌 Kyoto → Tokyo</h1><p class="note">Varış ~${esc(nt.arrive)} (yarın) · ${esc(nt.arrivePlace || '')}${n ? ` · ${fmtDur(n.sm + 1440 - s.nm)} sonra` : ''}</p>

      <h1 class="serif">Gün ${n ? fmtM(n.sm) : ''}'da başlıyor</h1><p class="note">${n ? `İlk durak: ${esc(n.plan)} · ${fmtDur(n.sm - s.nm)} sonra` : ''}</p></section>`;

      <h1 class="serif">İyi geceler 🌙</h1><p class="note">${nt && nt.type === 'hotel' ? `Bu gece: ${esc(hotelName(nt.h))}` : ''}${s.nextDay && n ? `<br>Yarın ilk durak ${esc(n.s)}: ${esc(n.plan)}` : ''}</p></section>`;

function nextCard(s){
  const n = s.next; if (!n) return '';

function scheduleCard(s){
  const sc = schedule(s);
  let msg = '', box = '';
  if (sc.kind === 'none') msg = 'Henüz bugün işaret yok. Yaptıklarını <b>✔ Yapıldı</b> ile işaretle; planın neresinde olduğunu göstereyim.';
  else if (sc.kind === 'complete') msg = '🎉 Bugünkü tüm aktiviteleri işaretledin.';
  else if (sc.kind === 'ontime') msg = `Plana uygunsun. Sıradaki işaretlenmemiş: <b>${esc(sc.pending.plan)}</b>`;
  else if (sc.kind === 'ahead') msg = `<b>${fmtDur(sc.min)} ileridesin.</b> Sıradaki (${esc(sc.pending.s)}): ${esc(sc.pending.plan)}`;
  else if (sc.kind === 'behind') {
    msg = `<b style="color:var(--bad)">${fmtDur(sc.min)} gerindesin.</b> “${esc(sc.pending.plan)}” ${fmtM(sc.pending.em)}'de bitmeliydi.`;
    if (sc.min >= 30) box = sc.suggest && sc.suggest.length
      ? `<div class="warnbox">Atlamayı düşün: ${sc.suggest.map(a => `<b>${esc(a.plan)}</b> (${esc(a.s)})`).join(', ')}<div class="btns2">${sc.suggest.slice(0, 2).map(a => `<button class="btn sm" data-a="skip" data-id="${esc(a.id)}">${IC.skip}${esc(a.plan.slice(0, 22))} atla</button>`).join('')}</div></div>`
      : `<div class="warnbox">Bugün isteğe bağlı durak kalmadı; sıradaki durakları kısaltmayı düşün.</div>`;
  }
  return `<section class="card flat"><div class="between"><div class="eyebrow" style="margin:0">Planın neresindeyim</div><b class="small">%${sc.pct} · ${sc.done}/${sc.total}</b></div>
    <div class="bar city-${cityOf(s.day)}"><i style="width:${sc.pct}%"></i></div><div class="small">${msg}</div>${box}</section>`;
}
function nearbyList(s, limit){
  const days = [s.day, PLAN[s.di + 1]].filter(Boolean);
  const seen = new Map();
  days.forEach((d, k) => liveActs(d).forEach(a => {
    if (a.lat == null) return;
    const key = `${d.date}|${a.lat.toFixed(4)},${a.lng.toFixed(4)}`;
    if (!seen.has(key)) seen.set(key, {a, d, k, acts:[a]}); else seen.get(key).acts.push(a);
  }));
  const arr = Array.from(seen.values()).map(x => Object.assign(x, {km:distTo(x.a)}));
  arr.sort((p, q) => (p.km == null ? 1e9 : p.km) - (q.km == null ? 1e9 : q.km));
  return limit ? arr.slice(0, limit) : arr;
}

const MAP = {m:null, layer:null, me:null, acc:null, day:null, tried:false, failed:false, tileErr:0};
function vMap(){

function loadLeaflet(){
  if (window.L) return Promise.resolve();
  if (MAP.loading) return MAP.loading;
  MAP.loading = new Promise((res, rej) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css'; document.head.appendChild(css);
    const js = document.createElement('script'); js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
    js.onload = () => res(); js.onerror = () => { MAP.loading = null; rej(new Error('Leaflet yüklenemedi')); };
    document.head.appendChild(js);
  });
  return MAP.loading;
}
function ensureMap(){
  document.documentElement.style.setProperty('--toph', $('#top').offsetHeight + 'px');
  loadLeaflet().then(() => {
    if (!MAP.m) {
      MAP.m = L.map('map', {zoomControl:false, attributionControl:true}).setView([35.3, 137.5], 6);
      L.control.zoom({position:'bottomleft'}).addTo(MAP.m);
      setTiles();
      MAP.layer = L.layerGroup().addTo(MAP.m);
      MAP.fitNext = true;
    }
    $('#mapfb').classList.add('hide');
    MAP.m.invalidateSize();
    drawMap(); mapMsg();
  }).catch(e => { console.error('Harita hatası: ' + (e && e.stack || e)); MAP.failed = true; mapFallback(); });
}
function setTiles(){
  // Yalnızca OpenStreetMap. OSM sunucuları Referer başlığı ister: HTTPS/localhost'ta çalışır, file:// açılışta engellenir.
  if (!MAP.m) return;
  if (MAP.tl) MAP.tl.remove();
  MAP.tl = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, crossOrigin:'anonymous', referrerPolicy:'strict-origin-when-cross-origin',
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> katkıcıları'});
  MAP.tl.on('tileerror', () => { MAP.tileErr++; if (MAP.tileErr === 6) mapMsg(); });
  MAP.tl.on('tileload', () => { if (MAP.tileErr) { MAP.tileErr = 0; mapMsg(); } });
  if (location.protocol !== 'file:') MAP.tl.addTo(MAP.m);
}
function mapMsg(){
  const off = !navigator.onLine || MAP.tileErr >= 6;
  if (location.protocol === 'file:') { $('#mapmsg').innerHTML = `<div class="card flat small" style="margin:0"><b>Harita arka planı dosyadan açılınca yüklenmez.</b> OpenStreetMap, isteğin hangi siteden geldiğini görmek ister; <code>file://</code> bunu göndermez. HTTPS adresinden (GitHub Pages) ya da bilgisayarda yerel sunucuyla aç. Duraklar ve rotalar yine burada. <button class="btn sm" data-a="map-list">Liste görünümü</button></div>`; return; }
  $('#mapmsg').innerHTML = off ? `<div class="card flat small" style="margin:0">📴 İnternet yok gibi görünüyor: yalnızca daha önce açtığın bölgelerin haritası görünür. <button class="btn sm" data-a="map-list">Liste görünümü</button></div>` : '';
}
function mapStops(){
  const days = MAP.day === 'all' ? PLAN : [dayOf(MAP.day)].filter(Boolean);
  const out = [];
  days.forEach(d => {
    const g = new Map();
    liveActs(d).forEach(a => { if (a.lat == null) return; const k = a.stop != null ? 's' + a.stop : `${a.lat},${a.lng}`; if (!g.has(k)) g.set(k, {d, acts:[], lat:a.lat, lng:a.lng, n:a.stop != null ? a.stop : '+', name:a.stopName || a.plan}); g.get(k).acts.push(a); });

}

      ${sp.acts.map(a => `<div style="margin-top:6px">${stOf(a.id) === 'done' ? '✅' : stOf(a.id) === 'skip' ? '⏭️' : '▫️'} ${esc(a.s)} ${esc(a.plan)}</div>`).join('')}
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><a class="btn sm" href="${esc(mapUrl(sp.acts[0]))}" target="_blank" rel="noopener">Maps</a><a class="btn sm" href="${esc(dirUrl(sp.acts[0]))}" target="_blank" rel="noopener">Yol tarifi</a><button class="btn sm okline" data-a="done" data-id="${esc(sp.acts[sp.acts.length - 1].id)}">✔</button><button class="btn sm" data-a="open" data-id="${esc(sp.acts[sp.acts.length - 1].id)}">Ayrıntı</button></div>`);
    bounds.push([sp.lat, sp.lng]);
  });

  if (MAP.fitNext && bounds.length) { MAP.m.fitBounds(bounds, {padding:[40, 40], maxZoom:15}); MAP.fitNext = false; }
  else if (!bounds.length && MAP.fitNext) MAP.m.setView([35.3, 137.5], 6);

function drawMe(){

function norm(s){ return String(s || '').toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i'); }
let SEARCH_IDX = null;
function searchIndex(){
  const I = [];
  PLAN.forEach(d => d.acts.forEach(a => I.push({t:'Plan', title:a.plan, sub:`${fmtDay(a.d)} ${a.s}${a.stopName ? ' · ' + a.stopName : ''}`, text:[a.plan, a.note, a.stopName, qText(a), (S.prog[a.id] || {}).note].join(' '), act:a.id})));
  D.food.forEach(f => I.push({t:'Yemek', title:f.name, sub:`${f.city} · ${f.area || ''} · ${f.day || ''}`, text:Object.values(f).join(' '), to:'yemek', flash:'food-' + f.id}));
  D.sights.forEach(x => I.push({t:'Görülecek', title:x.name, sub:`${x.city} · ${x.day || ''}`, text:Object.values(x).join(' '), to:'liste/gorulecek', flash:'sight-' + x.id}));
  D.buy.forEach(b => I.push({t:'Alınacak', title:b.name, sub:b.cat, text:Object.values(b).join(' '), to:'liste/al', flash:'buy-' + b.id}));
  D.hotels.forEach(h => I.push({t:'Otel', title:h.name, sub:h.label, text:Object.values(h).join(' '), to:'diger/oteller', flash:'hotel-' + h.row}));
  D.transport.forEach(x => I.push({t:'Ulaşım', title:x.route, sub:x.when, text:Object.values(x).join(' '), to:'diger/ulasim', flash:'tr-' + x.row}));
  D.resv.forEach(r => I.push({t:'Rezervasyon', title:r.name, sub:r.status, text:Object.values(r).join(' '), to:'diger/rezervasyonlar', flash:'resv-' + r.id}));
  D.practical.forEach(n => I.push({t:'Not', title:n.topic, sub:'Pratik notlar', text:n.topic + ' ' + n.text, to:'diger/notlar', flash:'note-' + n._row}));
  D.tokyoNotes.forEach(n => I.push({t:'Not', title:n.name, sub:n.label, text:[n.label, n.name, n.text].join(' '), to:'diger/rezervasyonlar'}));
  (S.lists || []).forEach(l => l.items.forEach(i => I.push({t:'Listem', title:i.text, sub:l.name, text:i.text + ' ' + l.name, to:'liste/benim', flash:'list-' + l.id})));
  I.forEach(x => { x.n = norm(x.text + ' ' + x.title); });
  return I;
}
function openSearch(){
  SEARCH_IDX = searchIndex();
  full(`<div class="row" style="flex-wrap:nowrap"><input class="inp" id="q" type="search" placeholder="Yer, yemek, not ara… (ör. ramen, Kinkaku)" autocomplete="off" style="flex:1"><button class="iconbtn" data-a="full-close" aria-label="Kapat">${IC.x}</button></div><div id="qres" style="margin-top:12px"><p class="muted small">Plan, yemek, görülecekler, alınacaklar, oteller, ulaşım, rezervasyonlar ve notlarının hepsinde arar.</p></div>`);
  const q = $('#q'); q.focus();
  q.addEventListener('input', () => {
    const terms = norm(q.value).split(/\s+/).filter(Boolean);

/* ---------------- hava durumu (Open-Meteo) */
const WMO = c => c === 0 ? ['☀️', 'Açık'] : c <= 1 ? ['🌤️', 'Çoğunlukla açık'] : c === 2 ? ['⛅', 'Parçalı bulutlu'] : c === 3 ? ['☁️', 'Kapalı'] : c <= 48 ? ['🌫️', 'Sis'] : c <= 57 ? ['🌦️', 'Çisenti'] : c <= 67 ? ['🌧️', 'Yağmur'] : c <= 77 ? ['🌨️', 'Kar'] : c <= 82 ? ['🌧️', 'Sağanak'] : c <= 86 ? ['🌨️', 'Kar sağanağı'] : ['⛈️', 'Fırtına'];
function wxFetch(lat, lng, extra){
  const key = `wx:${lat.toFixed(2)},${lng.toFixed(2)}${extra || ''}`;
  try { const c = JSON.parse(localStorage.getItem(key) || 'null'); if (c && Date.now() - c.t < 3 * HOUR) return Promise.resolve(c.d); } catch (e) {}
  if (!navigator.onLine) return Promise.reject(new Error('offline'));
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo${extra || '&forecast_days=3'}`;
  return fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => { try { localStorage.setItem(key, JSON.stringify({t:Date.now(), d})); } catch (e) {} return d; });
}
function centroid(d){ const pts = liveActs(d).filter(a => a.lat != null); if (!pts.length) return null; return [pts.reduce((t, a) => t + a.lat, 0) / pts.length, pts.reduce((t, a) => t + a.lng, 0) / pts.length]; }
function fillWeather(){
  const slot = $('#wxslot'); if (!slot) return;
  const s = situation(now());
  const d = s.mode === 'trip' ? s.day : PLAN[0];
  const c = POS ? [POS.lat, POS.lng] : centroid(d); if (!c) return;
  const fuji = PLAN.find(x => x.date === '2026-12-30');
  const realToday = dateStr(Date.now());
  const fujiDays = fuji ? (dayStart(fuji.date) - dayStart(realToday)) / DAY_MS : -1;
  const jobs = [wxFetch(c[0], c[1]).catch(() => null)];
  const fc = fuji && centroid(fuji);
  const wantFuji = fc && fujiDays >= 0 && fujiDays <= 15;
  jobs.push(wantFuji ? wxFetch(fc[0], fc[1], `&start_date=${fuji.date}&end_date=${fuji.date}`).catch(() => null) : Promise.resolve(null));
  Promise.all(jobs).then(([w, f]) => {
    const el = $('#wxslot'); if (!el) return;
    if (!w || !w.daily) { el.innerHTML = ROUTE.tab === 'diger' ? '<p class="muted small">Hava durumu alınamadı (internet yok).</p>' : ''; return; }
    const dl = w.daily;
    let h = `<section class="card flat"><div class="between"><div class="eyebrow" style="margin:0">Hava · ${POS ? 'bulunduğun yer' : esc(CITY_TR[d.city])}</div><span class="tiny muted">Open-Meteo</span></div><div class="wx">${dl.time.map((t, i) => { const [ic, lb] = WMO(dl.weather_code[i]); return `<div><div class="tiny muted">${fmtDay(t)}</div><div class="ic">${ic}</div><div class="tiny">${lb}</div><b>${Math.round(dl.temperature_2m_max[i])}° / ${Math.round(dl.temperature_2m_min[i])}°</b><div class="tiny muted">☔ %${dl.precipitation_probability_max[i] == null ? '–' : dl.precipitation_probability_max[i]}</div></div>`; }).join('')}</div>`;
    if (f && f.daily && f.daily.time.length) {
      const code = f.daily.weather_code[0]; const bad = code >= 3;
      const backup = D.tokyoNotes.find(n => /hava yedeği/i.test(n.label || '')); const fr = D.resv.find(r => /FUJI/i.test(r.name || ''));
      h += bad ? `<div class="warnbox"><b>30 Aralık Fuji günü: ${WMO(code)[1].toLowerCase()} görünüyor.</b> Fuji görünmeyebilir. Yedek plan: ${backup ? `<b>${esc(backup.name)}</b> — ${esc(backup.text)}` : ''} ${fr && fr.alt ? '(' + esc(fr.alt) + ')' : ''}</div>`
        : `<div class="okbox small">30 Aralık Kawaguchiko tahmini: ${WMO(code)[0]} ${WMO(code)[1]} — Fuji planı için umut verici.</div>`;
    }
    el.innerHTML = h + '</section>';
  });
}

/* ---------------- günlük dışa aktarma */
function download(name, text, type){
  const blob = new Blob([text], {type:type || 'application/octet-stream'});
  const file = typeof File === 'function' ? new File([blob], name, {type:blob.type}) : null;
  if (file && navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
    navigator.share({files:[file], title:name}).catch(() => dl());
  } else dl();
  function dl(){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
}

/* ---------------- PIN */
async function hash(s){
  try { if (crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('jr:' + s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); } } catch (e) {}
  let h = 5381; for (const c of 'jr:' + s) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return 'd' + h.toString(16);
}
function lockIfNeeded(){
  if (!S.settings.pinHash) return;
  const el = $('#lock'); el.classList.remove('hide');
  el.innerHTML = `<div class="sun" style="width:44px;height:44px;border-radius:50%;background:var(--accent)"></div><h2 class="serif">Japonya</h2><input class="inp" id="pinin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="PIN">
    <button class="btn primary" data-a="unlock" style="min-width:220px">Aç</button><button class="btn ghost sm" data-a="pin-forgot">PIN'i unuttum</button><div class="tiny muted" style="max-width:280px;text-align:center">Bu kilit gerçek güvenlik sağlamaz; yalnızca meraklı gözlere karşı.</div>`;
  setTimeout(() => $('#pinin') && $('#pinin').focus(), 50);
}

/* ============================================================ olaylar */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a],[data-go]'); if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  const a = t.dataset.a, id = t.dataset.id;
  if (t.tagName === 'INPUT' || t.tagName === 'SELECT') return;
  switch (a) {
    case 'go': { const [tab, x, y] = t.dataset.to.split('/'); closeFull(); closeSheet(); if (tab === 'yemek' && x === 'bugun') { const s = situation(now()); if (s.mode === 'trip') FOOD_F.day = s.ds; go('yemek'); } else go(tab, x, y); break; }
    case 'done': case 'skip': setStatus(id, a); break;
    case 'note': openAct(id); setTimeout(() => $('#act-note') && $('#act-note').focus(), 250); break;
    case 'open': openAct(id); break;
    case 'note-save': { const p = S.prog[id] || (S.prog[id] = {}); p.note = $('#act-note').value.trim(); p.snap = snapOf(ACT[id]); if (!p.note) delete p.note; save(); toast('Not kaydedildi'); closeSheet(); render(); break; }
    case 'here': markHere(id); break;
    case 'close-sheet': closeSheet(); break;
    case 'full-close': closeFull(); break;
    case 'search': openSearch(); break;
    case 'search-go': { const x = SEARCH_IDX[+t.dataset.i]; closeFull(); if (x.act) { const aa = ACT[x.act]; go('plan', aa.d); setTimeout(() => { FLASH = 'act-' + aa.id; afterRender(); openAct(aa.id); }, 60); } else { FLASH = x.flash || null; if (x.to === 'yemek') FOOD_F = {city:'all', day:'all', kardes:false}; const [tb, s1] = x.to.split('/'); go(tb, s1); } break; }
    case 'sos': full(`<div class="between"><h1 class="serif">Acil durum</h1><button class="iconbtn" data-a="full-close" aria-label="Kapat">${IC.x}</button></div><div style="margin-top:12px">${sosHtml()}</div>`); break;
    case 'taxi': openTaxi(); break;
    case 'safe': shareSafe(); break;
    case 'geo': startGeo(true); toast('Konum isteniyor…'); break;
    case 'geo-off': stopGeo(); if (!(POS && POS.fake)) POS = null; S.geoOn = false; save(); render(); break;
    case 'nearby': openNearby(); break;
    case 'mode': S.settings.mode = t.dataset.v; save(); if (t.dataset.re === 'nearby') openNearby(); else render(); break;
    case 'theme': S.settings.theme = t.dataset.v; save(); applySettings(); render(); break;
    case 'font': S.settings.font = +t.dataset.v; save(); applySettings(); render(); break;
    case 'export': exportJSON(); break;
    case 'diary-txt': download(`japonya-gunluk-${dateStr(Date.now())}.txt`, diaryText(), 'text/plain;charset=utf-8'); break;
    case 'diary-json': download(`japonya-gunluk-${dateStr(Date.now())}.json`, JSON.stringify(diaryData(), null, 1), 'application/json'); break;
    case 'resv-done': S.resvDone[id] = !S.resvDone[id]; if (!S.resvDone[id]) delete S.resvDone[id]; save(); render(); break;
    case 'food-city': FOOD_F.city = t.dataset.v; render(); break;
    case 'food-kardes': FOOD_F.kardes = !FOOD_F.kardes; render(); break;
    case 'map-day': MAP.day = t.dataset.d; MAP.fitNext = true; history.replaceState(null, '', '#/harita/' + MAP.day); vMap(); drawMap(); break;
    case 'map-fit': MAP.fitNext = true; drawMap(); break;
    case 'map-locate': if (POS && MAP.m) MAP.m.setView([POS.lat, POS.lng], 16); else { startGeo(true); toast('Konum isteniyor…'); } break;
    case 'map-list': mapFallback(); break;
    case 'map-back': $('#mapfb').classList.add('hide'); break;
    case 'map-retry': MAP.failed = false; ensureMap(); break;
    case 'hotel-here': geoOnce().then(p => { S.hotelInfo[id] = Object.assign({}, S.hotelInfo[id] || {}, {lat:p.lat.toFixed(6), lng:p.lng.toFixed(6)}); save(); render(); toast('Otel konumu kaydedildi'); }).catch(() => toast('Konum alınamadı')); break;
    case 'list-new': { const name = (t.dataset.v || ($('#list-new') && $('#list-new').value) || '').trim(); if (!name) { toast('Liste adı gir'); return; } S.lists.push({id:uid(), name, items:[]}); save(); render(); break; }
    case 'list-del': { const l = S.lists.find(x => x.id === t.dataset.l); if (l && confirm(`“${l.name}” listesi silinsin mi?`)) { S.lists = S.lists.filter(x => x !== l); save(); render(); } break; }
    case 'li-add': listAdd(t.dataset.l); break;
    case 'li-del': { const l = S.lists.find(x => x.id === t.dataset.l); l.items = l.items.filter(i => i.id !== id); save(); const y = scrollY; render(); scrollTo(0, y); break; }
    case 'li-clear': { const l = S.lists.find(x => x.id === t.dataset.l); l.items = l.items.filter(i => !i.done); save(); render(); break; }
    case 'ics': exportICS(false); break;
    case 'ics-share': exportICS(true); break;
    case 'cal-alarm': S.cal = Object.assign({}, S.cal, {alarm:t.dataset.v}); save(); render(); break;
    case 'add-stop': openAddStop(t.dataset.d); break;
    case 'ad-here': geoOnce().then(p => { $('#ad-lat').value = p.lat.toFixed(6); $('#ad-lng').value = p.lng.toFixed(6); }).catch(() => toast('Konum alınamadı')); break;
    case 'ad-save': addStop(); break;
    case 'edit-save': editSave(id); break;
    case 'delete': if (confirm('Bu aktivite planından kaldırılsın mı? (Orijinal Excel verisi korunur; geri alabilirsin.)')) { S.edits.deleted[id] = {snap:snapOf(ACT[id]), t:Date.now()}; save(); buildPlan(); closeSheet(); render(); toast('Silindi — Plan > “Planımdan sildiklerim”den geri alabilirsin'); } break;
    case 'undelete': delete S.edits.deleted[id]; save(); buildPlan(); render(); break;
    case 'revert': delete S.edits.moved[id]; delete S.edits.deleted[id]; save(); buildPlan(); closeSheet(); render(); toast('Orijinale dönüldü'); break;
    case 'del-added': S.edits.added = S.edits.added.filter(x => x.id !== id); save(); buildPlan(); closeSheet(); render(); break;
    case 'revert-all': if (confirm('Tüm plan değişiklikleri (taşıma, silme, eklenen duraklar) geri alınsın mı? İşaretlerin ve notların korunur.')) { S.edits = {moved:{}, deleted:{}, added:[]}; save(); buildPlan(); render(); } break;
    case 'exp-add': { const amt = parseInt(($('#ex-amt').value || '').replace(/\D/g, ''), 10); if (!amt) { toast('Tutarı gir'); return; } S.exp.push({id:uid(), d:$('#ex-day').value, amt, cat:$('#ex-cat').value, note:$('#ex-note').value.trim(), at:now()}); save(); render(); toast(`${amt.toLocaleString('tr-TR')} ¥ eklendi`); break; }
    case 'exp-del': S.exp = S.exp.filter(x => x.id !== id); save(); render(); break;
    case 'doc-add': addDoc(); break;
    case 'doc-show': showDoc(id); break;
    case 'doc-del': if (confirm('Belge bu cihazdan silinsin mi?')) idbDel('docs', id).then(loadDocs).then(() => render()); break;
    case 'prox-done': setStatus(id, 'done'); closeProx(); break;
    case 'prox-here': markHere(id); closeProx(); break;
    case 'prox-no': S.prox[id] = 1; save(); closeProx(); break;
    case 'pin-set': { const v = ($('#pin1').value || '').trim(); if (!/^\d{4,8}$/.test(v)) { toast('4–8 haneli rakam gir'); return; } hash(v).then(hh => { S.settings.pinHash = hh; save(); toast('PIN kondu'); render(); }); break; }
    case 'pin-off': S.settings.pinHash = null; save(); render(); break;
    case 'unlock': hash(($('#pinin').value || '').trim()).then(hh => { if (hh === S.settings.pinHash) { $('#lock').classList.add('hide'); $('#lock').innerHTML = ''; } else { toast('PIN yanlış'); $('#pinin').value = ''; } }); break;
    case 'pin-forgot': if (prompt('PIN kaldırılacak (verilerin silinmez). Onay için SIFIRLA yaz:') === 'SIFIRLA') { S.settings.pinHash = null; save(); $('#lock').classList.add('hide'); } break;
    case 'check-update': checkUpdate(true); break;
    case 'apply-update': applyUpdate(); break;
    case 'howto': howto(); break;
    case 'wipe': if (prompt('Tüm işaretler, notlar, harcamalar ve ayarlar silinecek (belgeler hariç). Onay için SİL yaz:') === 'SİL') { S = blank(); save(); buildPlan(); render(); toast('Silindi'); } break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.a === 'shop') { if (t.checked) S.shop[t.dataset.id] = Date.now(); else delete S.shop[t.dataset.id]; save(); t.closest('.check').classList.toggle('on', t.checked); updateListBar(); }
  if (t.dataset.a === 'cal-presale-c') { S.cal = Object.assign({}, S.cal, {presale:t.checked}); save(); render(); }
  if (t.dataset.a === 'li-toggle') { const l = S.lists.find(x => x.id === t.dataset.l); const i = l.items.find(x => x.id === t.dataset.id); i.done = t.checked; save(); t.closest('.check').classList.toggle('on', t.checked); }
  if (t.dataset.a === 'seen') { if (t.checked) S.seen[t.dataset.id] = Date.now(); else delete S.seen[t.dataset.id]; save(); t.closest('.check').classList.toggle('on', t.checked); }
  if (t.dataset.a === 'food-day') { FOOD_F.day = t.value; render(); }
  if (t.dataset.a === 'import' && t.files[0]) importJSON(t.files[0]);
  if (t.dataset.lt) { if (t.value) S.lastTrain[t.dataset.lt] = t.value; else delete S.lastTrain[t.dataset.lt]; save(); toast(t.value ? 'Son tren kaydedildi: ' + t.value : 'Son tren silindi'); }
  if (t.id === 'ex-rate') { S.rate = t.value.trim(); save(); render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.hotel) { const r = t.dataset.hotel; S.hotelInfo[r] = Object.assign({}, S.hotelInfo[r] || {}, {[t.dataset.k]:t.type === 'checkbox' ? t.checked : t.value}); save(); }
  if (t.id === 'contacts') { S.contacts = t.value; save(); }
  if (t.dataset.pinfo) { const id = t.dataset.pinfo, p = S.prog[id] || (S.prog[id] = {}); p.info = Object.assign({}, p.info || {}, {[t.dataset.k]:t.value.trim()}); if (!p.info.hours && !p.info.price) delete p.info; p.snap = snapOf(ACT[id]); if (!p.st && !p.note && !p.here && !p.info) delete S.prog[id]; save(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.liAdd) { e.preventDefault(); listAdd(e.target.dataset.liAdd); } if (e.key === 'Enter' && e.target.id === 'list-new') $('[data-a="list-new"]').click(); if (e.key === 'Enter' && e.target.id === 'pinin') $('[data-a="unlock"]').click(); if (e.key === 'Escape') { closeSheet(); closeFull(); } });
function updateListBar(){ if (ROUTE.tab === 'liste') { const y = scrollY; render(); scrollTo(0, y); } }

function setStatus(id, s){
  const a = ACT[id]; if (!a) return;
  const p = S.prog[id] || (S.prog[id] = {});
  if (p.st === s) { delete p.st; delete p.t; } else { p.st = s; p.t = now(); }
  p.snap = snapOf(a);
  if (!p.st && !p.note && !p.here && !p.info) delete S.prog[id];
  save();
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
  toast(p.st === 'done' ? `✔ ${a.plan}` : p.st === 'skip' ? `Atlandı: ${a.plan}` : 'İşaret kaldırıldı');
  if ($('#sheet').classList.contains('on')) openAct(id);
  refreshSoft();
}
function markHere(id){
  const a = ACT[id];
  geoOnce().then(pos => { const p = S.prog[id] || (S.prog[id] = {}); p.here = {lat:pos.lat, lng:pos.lng, acc:Math.round(pos.acc), t:now()}; p.snap = snapOf(a); save(); toast('📍 Konum ve saat kaydedildi'); if ($('#sheet').classList.contains('on')) openAct(id); refreshSoft(); })
    .catch(() => toast(location.protocol === 'file:' ? 'Konum için sayfayı HTTPS adresinden aç' : 'Konum alınamadı'));
}
function editSave(id){
  const a = ACT[id]; const d = $('#ed-d').value, s = $('#ed-s').value, e = $('#ed-e').value, p = $('#ed-p').value.trim();
  if (!s) { toast('Başlangıç saatini gir'); return; }
  if (a.added) { const x = S.edits.added.find(z => z.id === id); Object.assign(x, {d, s, e, plan:p || x.plan}); }
  else {
    const o = ORIG[id];
    const mv = {snap:snapOf(o)}; if (d !== o.d) mv.d = d; if (s !== o.s) mv.s = s; if (e !== o.e) mv.e = e; if (p && p !== o.plan) mv.plan = p;
    if (Object.keys(mv).length > 1) S.edits.moved[id] = mv; else delete S.edits.moved[id];
  }
  save(); buildPlan(); closeSheet(); render(); toast('Plan güncellendi');
}
function addStop(){
  const plan = $('#ad-p').value.trim(); if (!plan) { toast('Ad gir'); return; }
  const url = $('#ad-u').value.trim(), lat = parseFloat(($('#ad-lat').value || '').replace(',', '.')), lng = parseFloat(($('#ad-lng').value || '').replace(',', '.'));
  const x = {id:'ek-' + uid(), d:$('#ad-d').value, s:$('#ad-s').value || '12:00', e:$('#ad-e').value || '', plan, note:$('#ad-n').value.trim(), url:safeUrl(url) || null, tags:[], rz:false};
  if (!isNaN(lat) && !isNaN(lng)) { x.lat = lat; x.lng = lng; x.stopName = plan; }
  S.edits.added.push(x); save(); buildPlan(); closeSheet(); go('plan', x.d); toast('Durak eklendi');
}
function scaleImage(file){
  return new Promise(res => {
    if (!/^image\//.test(file.type)) return res(file);
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => { const M = 2400, k = Math.min(1, M / Math.max(img.width, img.height)); if (k >= 1) { URL.revokeObjectURL(u); return res(file); }
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(u); res(b || file); }, 'image/jpeg', .88); };
    img.onerror = () => { URL.revokeObjectURL(u); res(file); }; img.src = u;
  });
}
function addDoc(){
  const f = $('#doc-file').files[0]; if (!f) { toast('Fotoğraf seç'); return; }
  scaleImage(f).then(blob => idbPut('docs', null, {id:uid(), title:$('#doc-title').value.trim() || f.name, kind:$('#doc-kind').value, ref:$('#doc-ref').value.trim(), actId:$('#doc-act').value || null, blob, createdAt:Date.now()}))
    .then(loadDocs).then(() => { toast('Belge cihazına kaydedildi'); render(); if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); });
}
function showDoc(id){
  idbGet('docs', id).then(d => { if (!d) return; const u = d.blob ? URL.createObjectURL(d.blob) : '';
    full(`<div class="between"><div><b>${esc(d.title || 'Belge')}</b><div class="tiny" style="opacity:.7">${esc(d.kind)}${d.ref ? ' · ' + esc(d.ref) : ''}</div></div><button class="iconbtn" data-a="full-close" aria-label="Kapat" style="background:#222;color:#fff;border-color:#444">${IC.x}</button></div>
      <div class="tiny" style="opacity:.7;margin:8px 0">Görevliye göstermeden önce ekran parlaklığını artır.</div>${u ? `<img class="docimg" src="${u}" alt="${esc(d.title || '')}">` : ''}`, true); });
}

/* ---------------- kaydırarak gün değiştirme */
let tx0 = null;
document.addEventListener('touchstart', e => { if (ROUTE.tab !== 'plan' || $('#sheet').classList.contains('on') || e.target.closest('.daystrip')) { tx0 = null; return; } tx0 = [e.touches[0].clientX, e.touches[0].clientY]; }, {passive:true});
document.addEventListener('touchend', e => {
  if (!tx0) return; const dx = e.changedTouches[0].clientX - tx0[0], dy = e.changedTouches[0].clientY - tx0[1]; tx0 = null;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  const cur = ROUTE.a && DAYIDX[ROUTE.a] != null ? DAYIDX[ROUTE.a] : (situation(now()).mode === 'trip' ? situation(now()).di : 0);
  const n = cur + (dx < 0 ? 1 : -1); if (PLAN[n]) go('plan', PLAN[n].date);
}, {passive:true});

/* ---------------- ayarlar uygula */
function applySettings(){
  const r = document.documentElement;
  if (S.settings.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.settings.theme);
  r.setAttribute('data-font', String(S.settings.font || 0));
}

/* ---------------- service worker ve güncelleme */
let SWREG = null;
function swInit(){
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    SWREG = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate();
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(); }); });
    setInterval(() => { if (!document.hidden) reg.update().catch(() => {}); }, 30 * 60 * 1000);
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading || !UPD_REQ) return; reloading = true; location.reload(); });
}
let UPD_REQ = false;
function showUpdate(){ const el = $('#upd'); el.classList.remove('hide'); el.innerHTML = `<div class="card"><div class="between"><div><b>Güncelleme var</b><div class="small muted">Yeni plan/sürüm yüklendi. İşaretlerin korunur.</div></div><button class="btn primary sm" data-a="apply-update">Yenile</button></div></div>`; }
function applyUpdate(){ UPD_REQ = true; if (SWREG && SWREG.waiting) SWREG.waiting.postMessage({type:'SKIP_WAITING'}); else location.reload(); }
function checkUpdate(manual){ if (!SWREG) { if (manual) toast('Güncelleme kontrolü yalnızca HTTPS adresinde çalışır'); return; } SWREG.update().then(() => { if (manual && !SWREG.waiting && !SWREG.installing) toast('Güncel sürümdesin (' + VERSION + ')'); }).catch(() => manual && toast('Kontrol edilemedi (internet yok?)')); }

/* ---------------- başlat */
applySettings();
buildPlan();
const remapped = remapOrphans(); if (remapped) buildPlan();
ROUTE = parseHash();
render();
lockIfNeeded();
loadDocs().then(() => { if (DOCS.length) refreshSoft(); });
// IndexedDB yedeği localStorage'dan yeniyse (ör. tarayıcı depoyu temizlediyse) geri yükle
idbGet('kv', 'state').then(x => {
  if (x && (x.savedAt || 0) > (S.savedAt || 0) + 1000) { S = merge(blank(), x); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} buildPlan(); remapOrphans(); buildPlan(); render(); toast('İlerleme cihaz yedeğinden (IndexedDB) geri yüklendi'); }
  else if (!x && S.savedAt) save();
});
if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(q => { const el = () => $('#quota'); const txt = `${(q.usage / 1048576).toFixed(1)} MB kullanılıyor`; window.__quota = txt; if (el()) el().textContent = txt; });
if (POS && POS.fake) setTimeout(checkProximity, 300);
else if (S.geoOn && navigator.permissions && navigator.permissions.query) navigator.permissions.query({name:'geolocation'}).then(p => { if (p.state === 'granted') startGeo(false); }).catch(() => {});
swInit();
setInterval(() => { if (!document.hidden && !$('#full').classList.contains('on')) refreshSoft(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshSoft(); if (S.geoOn && geoTimer) geoOnce().then(onPos).catch(() => {}); if (SWREG) SWREG.update().catch(() => {}); } });
window.addEventListener('online', () => { if (ROUTE.tab === 'harita') { if (!MAP.m) ensureMap(); mapMsg(); } refreshSoft(); });
window.addEventListener('offline', () => { if (ROUTE.tab === 'harita') mapMsg(); });
const mo = new MutationObserver(() => { if ($('img[data-thumb]:not([data-l])')) fillThumbs(); const q = $('#quota'); if (q && window.__quota && q.textContent !== window.__quota) q.textContent = window.__quota; });
mo.observe($('#view'), {childList:true, subtree:true});
window.__app = {situation, now, PLAN:() => PLAN, S:() => S, ACT:() => ACT, schedule, VERSION};
})();
</script>
